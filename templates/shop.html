  <script>
    const dict = {
      en: {
        products:{title:"Our Products", blurb:"Experience the transformative power of natural ingredients with our carefully crafted hair care collection"},
        p:{common:{use:"How to Use", what:"What It Does", key:"Key Ingredients"}},
        p1:{name:"Sea Salt Spray", desc:"Create effortless beach waves with our mineral-rich sea salt spray that adds natural volume and texture.", use:"Spray evenly on damp or dry hair. Scrunch or style with your fingers for natural texture. Let it air dry or use a diffuser for extra volume.", w1:"Adds natural volume and lift", w2:"Creates raw, beach-style texture", w3:"Helps balance scalp with essential minerals", k1:"Dead Sea Minerals: Strengthen hair fibers, improve scalp health", k2:"Magnesium & Calcium: Support natural shine and elasticity"},
        p2:{name:"Nourishing Shampoo", desc:"Gently cleanse and strengthen your hair with our nutrient-rich shampoo formula.", use:"Massage 2–3 pumps into wet hair and scalp. Work into a rich lather, rinse thoroughly. Repeat if needed.", w1:"Cleanses gently without stripping natural oils", w2:"Strengthens roots and repairs hair fibers", w3:"Boosts shine and elasticity", k1:"Aloe Vera: Hydrates scalp and soothes irritation", k2:"Argan Oil: Nourishes and protects against dryness", k3:"Rosemary Oil: Stimulates scalp circulation and promotes growth", k4:"Vitamin E & B5: Support healthy, resilient hair", k5:"Silk Protein: Improves softness and shine"},
        p3:{name:"Hydrating Conditioner", desc:"Deeply hydrates and nourishes hair, repairs split ends and strengthens strands. Improves smoothness, shine, and manageability.", use:"After shampooing, apply evenly to mid-lengths and ends. Leave for 2–3 minutes, then rinse well.", w1:"Deeply hydrates and nourishes hair", w2:"Repairs split ends and strengthens strands", w3:"Improves smoothness, shine, and manageability", k1:"Coconut Oil: Restores moisture and adds softness", k2:"Rice Oil: Strengthens and enhances flexibility", k3:"Vitamin E & B5: Support hair health, hydration, and protection"},
        p4:{name:"SHARP Natural Hair Treatment – Nourishing Oil Blend", desc:"Repairs and nourishes damaged and split ends, reduces frizz and adds healthy natural shine. Strengthens hair and promotes overall hair health.", use:"Apply 2–4 drops to damp or dry hair, focusing on the ends. Use daily as a leave-in or overnight treatment for deep nourishment, softness, and natural shine.", benefits:"Benefits", w1:"Repairs and nourishes damaged and split ends", w2:"Reduces frizz and adds healthy, natural shine", w3:"Strengthens hair and promotes overall hair health", key:"Key Ingredients & Benefits", k1:"Sunflower Oil: Moisturizes and protects hair from dryness", k2:"Sweet Almond Oil: Adds nourishment and softness", k3:"Castor Oil: Strengthens hair and supports growth", k4:"Coconut Oil: Hydrates and enhances natural shine", k5:"Aloe Vera Extract: Soothes the scalp and hydrates hair", k6:"Laurel, Cress, and Lavender Oils: Nourish and revitalize hair", k7:"Garlic Oil: Supports scalp health and strengthens follicles", k8:"Vitamin E (Tocopherol): Protects hair from damage and boosts shine"}
      },
      ar: {
        products:{title:"منتجاتنا", blurb:"اختبر القوة التحويلية للمكونات الطبيعية مع مجموعة العناية بالشعر المصنوعة بعناية"},
        p:{common:{use:"طريقة الاستخدام", what:"الفوائد", key:"المكونات الرئيسية"}},
        p1:{name:"سبراي ملح البحر", desc:"اعمل تموجات شاطئية طبيعية مع سبراي ملح البحر الغني بالمعادن اللي بيضيف حجم وملمس طبيعي.", use:"رش على شعر رطب أو جاف، وزع بيدك أو اعمل \"scrunch\" لحتى يطلعلك Texture طبيعي. فيك تخليه ينشف عالهوا أو تستعمل مجفف بديفيوزر لزيادة الحجم.", w1:"بيعطي حجم طبيعي ورفع للشعر", w2:"بيعمل Texture عفوي وستايل شاطئ", w3:"المعادن بتوازن فروة الرأس وبتقوي الشعر", k1:"معادن البحر الميت: بتقوي ألياف الشعر وبتحسّن صحة الفروة", k2:"مغنيسيوم + كالسيوم: بيعززوا اللمعة والمرونة"},
        p2:{name:"الشامبو", desc:"نظف وقوي شعرك بلطف مع تركيبة الشامبو الغنية بالعناصر الغذائية.", use:"استعمل 2–3 ضغطات على شعر مبلل، دلك فروة الرأس منيح، اعمل رغوة، واغسل كويس. فيك تعيد حسب الحاجة.", w1:"تنظيف لطيف بدون ما يزيل زيوت الشعر الطبيعية", w2:"يقوي الجذور ويصلح ألياف الشعر", w3:"بيعطي لمعة ومرونة طبيعية", k1:"الألوفيرا: بترطّب الفروة وبتخفف التهيّج", k2:"زيت الأرجان: بيغذّي الشعر ويحميه من الجفاف", k3:"زيت الروزماري: بنشّط الدورة الدموية بالفروة وبدعم النمو", k4:"فيتامين E + B5: بيعززوا صحة وقوة الشعر", k5:"بروتين الحرير: بيضيف نعومة ولمعة"},
        p3:{name:"البلسم", desc:"يرطب ويغذي الشعر بعمق، ويصلح الأطراف المتقصفة ويقوي الخصلات. يحسن النعومة واللمعان وسهولة التحكم.", use:"بعد الشامبو، وزع بالتساوي على منتصف الشعر والأطراف. اتركه لمدة 2-3 دقائق، ثم اشطفه جيداً.", w1:"يرطب ويغذي الشعر بعمق", w2:"يصلح الأطراف المتقصفة ويقوي الخصلات", w3:"يحسن النعومة واللمعان وسهولة التحكم", k1:"زيت جوز الهند: يستعيد الرطوبة ويضيف النعومة", k2:"زيت الأرز: يقوي ويعزز المرونة", k3:"فيتامين E و B5: يدعم صحة الشعر والترطيب والحماية"},
        p4:{name:"علاج الشعر الطبيعي SHARP - خليط الزيوت المغذي", desc:"يصلح ويغذي الأطراف التالفة والمتقصفة، يقلل التجعد ويضيف لمعاناً طبيعياً صحياً. يقوي الشعر ويعزز صحة الشعر العامة.", use:"ضع 2-4 قطرات على الشعر المبلل أو الجاف، مع التركيز على الأطراف. استخدمه يومياً كعلاج بدون شطف أو طوال الليل للتغذية العميقة والنعومة واللمعان الطبيعي.", benefits:"الفوائد", w1:"يصلح ويغذي الأطراف التالفة والمتقصفة", w2:"يقلل التجعد ويضيف لمعاناً طبيعياً صحياً", w3:"يقوي الشعر ويعزز صحة الشعر العامة", key:"المكوّنات الرئيسية والفوائد", k1:"زيت عباد الشمس: يرطب ويحمي الشعر من الجفاف", k2:"زيت اللوز الحلو: يضيف التغذية والنعومة", k3:"زيت الخروع: يقوي الشعر ويدعم النمو", k4:"زيت جوز الهند: يرطب ويعزز اللمعان الطبيعي", k5:"مستخلص الألوفيرا: يهدئ فروة الرأس ويرطب الشعر", k6:"زيوت الغار والجرجير واللافندر: تغذي وتنشّط الشعر", k7:"زيت الثوم: يدعم صحة فروة الرأس ويقوي البصيلات", k8:"فيتامين E (توكوفيرول): يحمي الشعر من التلف ويعزز اللمعان"}
      }
    };

    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    function applyLanguage(lang){
      const d = dict[lang] || dict.en;
      $$('[data-i18n]').forEach(el => {
        const path = el.getAttribute('data-i18n').split('.');
        let val = d;
        for (const p of path){ val = val?.[p]; }
        if (typeof val === 'string') el.textContent = val;
      });
      document.documentElement.lang = (lang === 'ar' ? 'ar' : 'en');
      document.documentElement.dir = (lang === 'ar' ? 'rtl' : 'ltr');
      $('#btn-en').setAttribute('aria-pressed', lang==='en');
      $('#btn-ar').setAttribute('aria-pressed', lang==='ar');
      localStorage.setItem('lang', lang);
    }

    // events
    $('#btn-en').addEventListener('click', ()=>applyLanguage('en'));
    $('#btn-ar').addEventListener('click', ()=>applyLanguage('ar'));

    // init
    $('#year').textContent = new Date().getFullYear();
    applyLanguage(localStorage.getItem('lang') || (navigator.language?.startsWith('ar') ? 'ar' : 'en'));
  </script>
</body>
</html>
