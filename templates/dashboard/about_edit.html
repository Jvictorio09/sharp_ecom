{% extends "dashboard/cms_base.html" %}

{% block content %}
<div>
  <h1 class="text-3xl font-bold mb-6">About Section</h1>
  
  <form method="post" class="bg-white rounded-lg p-6 shadow max-w-2xl">
    {% csrf_token %}
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Title</label>
      <input type="text" name="title" value="{{ about.title }}" 
             class="w-full border rounded p-2" required>
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Content</label>
      <textarea name="content" rows="8" 
                class="w-full border rounded p-2" required>{{ about.content }}</textarea>
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Image URL</label>
      <input type="url" name="image_url" value="{{ about.image_url }}" 
             class="w-full border rounded p-2" placeholder="https://...">
      <a href="{% url 'gallery' %}" class="text-blue-600 text-sm mt-1 block">Browse Gallery →</a>
    </div>
    
    <div class="mb-4">
      <label class="flex items-center">
        <input type="checkbox" name="is_active" {% if about.is_active %}checked{% endif %} 
               class="mr-2">
        <span>Active</span>
      </label>
    </div>
    
    <button type="submit" class="bg-[var(--sharp-mineral)] text-white px-6 py-2 rounded hover:bg-opacity-90">
      Save Changes
    </button>
  </form>
</div>
{% endblock %}
