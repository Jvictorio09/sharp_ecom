{% extends "dashboard/cms_base.html" %}

{% block content %}
<div>
  <h1 class="text-3xl font-bold mb-6">SEO Settings</h1>
  
  <form method="post" class="bg-white rounded-lg p-6 shadow max-w-2xl">
    {% csrf_token %}
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Page Title</label>
      <input type="text" name="title" value="{{ seo.title }}" 
             class="w-full border rounded p-2" placeholder="Homepage Title">
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Meta Description</label>
      <textarea name="description" rows="3" 
                class="w-full border rounded p-2" 
                placeholder="Meta description for search engines">{{ seo.description }}</textarea>
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">Keywords (comma-separated)</label>
      <input type="text" name="keywords" value="{{ seo.keywords }}" 
             class="w-full border rounded p-2" placeholder="keyword1, keyword2, keyword3">
    </div>
    
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2">OG Image URL</label>
      <input type="url" name="og_image_url" value="{{ seo.og_image_url }}" 
             class="w-full border rounded p-2" placeholder="https://...">
    </div>
    
    <button type="submit" class="bg-[var(--sharp-mineral)] text-white px-6 py-2 rounded hover:bg-opacity-90">
      Save Changes
    </button>
  </form>
</div>
{% endblock %}
