<a id="waFloat"
   class="wa-wrap fixed bottom-6 right-6 z-[90]"
   href="#"
   target="_blank" rel="noopener nofollow"
   aria-label="Chat on WhatsApp"
   data-wa="971795003006"
   data-text="Hi SHARP! I have a quick question about your hair products.">

  <!-- Ambient glow behind the coin (very soft) -->
  <span class="wa-ambient" aria-hidden="true"></span>

  <!-- The coin -->
  <span class="wa-coin" aria-hidden="true">
    <span class="wa-ring"></span>
    <span class="wa-face">
      <svg viewBox="0 0 32 32" class="wa-ico" aria-hidden="true">
        <path d="M19.11 17.13c-.27-.14-1.61-.79-1.86-.88-.25-.09-.43-.14-.61.14-.18.27-.7.88-.86 1.06-.16.18-.32.2-.59.07-.27-.14-1.14-.42-2.17-1.34-.8-.71-1.34-1.58-1.5-1.85-.16-.27-.02-.41.12-.55.12-.12.27-.32.41-.48.14-.16.18-.27.27-.45.09-.18.05-.34-.02-.48-.07-.14-.61-1.47-.84-2.01-.22-.53-.45-.46-.61-.47-.16-.01-.34-.01-.52-.01-.18 0-.48.07-.73.34-.25.27-.96.94-.96 2.29s.99 2.66 1.12 2.84c.14.18 1.95 2.98 4.72 4.17.66.28 1.18.45 1.58.58.66.21 1.26.18 1.73.11.53-.08 1.61-.66 1.84-1.3.23-.64.23-1.18.16-1.3-.07-.12-.25-.2-.52-.34zM16 3.2C9.5 3.2 4.2 8.51 4.2 15c0 2.09.56 4.04 1.54 5.72L4 28l7.48-1.96A11.74 11.74 0 0 0 16 26.8c6.5 0 11.8-5.31 11.8-11.8S22.5 3.2 16 3.2z"/>
      </svg>
    </span>
  </span>
</a>

<style>
/* ---- Layout ---- */
.wa-wrap { display:inline-block; }
.wa-coin {
  position: relative;
  display: grid;
  place-items: center;
  width: 56px; height: 56px;
  border-radius: 9999px;
  transform: translateZ(0);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  box-shadow:
    0 12px 30px rgba(0,0,0,.12),
    0 2px 6px rgba(0,0,0,.10);
  background: #fff;
}
.wa-ring {
  position:absolute; inset: 4px;
  border-radius: inherit;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.9), inset 0 0 0 1px rgba(0,0,0,.04);
  background:
    radial-gradient(120% 120% at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.8) 40%, rgba(255,255,255,.6) 60%, rgba(255,255,255,.4) 100%);
}
.wa-face {
  position:absolute; inset: 6px;
  border-radius: inherit;
  background:
    radial-gradient(120% 140% at 30% 20%, #34e27a, #25D366 55%, #1abb55 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65),
    inset 0 -2px 6px rgba(0,0,0,.10);
  display:grid; place-items:center;
}
.wa-ico { width: 22px; height: 22px; fill: #fff; filter: drop-shadow(0 1px 0 rgba(0,0,0,.10)); }

/* Ambient glow with calm wave pulse */
.wa-ambient {
  position:absolute; inset: -14px;
  border-radius: 9999px;
  background: radial-gradient(60% 60% at 50% 50%, rgba(37,211,102,.35), rgba(37,211,102,0) 70%);
  filter: blur(8px);
  opacity: .65;
  pointer-events:none;
  animation: waWave 4s ease-in-out infinite;
}

@keyframes waWave {
  0%, 100% { opacity:.55; transform: scale(1); }
  50%      { opacity:.25; transform: scale(1.15); }
}

/* Hover / Active */
.wa-wrap:hover .wa-coin { transform: translateY(-1px); }
.wa-wrap:active .wa-coin { transform: translateY(0); }
.wa-wrap:hover .wa-ambient { opacity:.8; }

/* Respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  .wa-ambient { animation: none !important; }
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .wa-coin { box-shadow: 0 16px 36px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.25); }
  .wa-ambient { opacity: .75; }
}

</style>

<script>
  (function () {
    const el = document.getElementById('waFloat');
    if (!el) return;
    const raw = (el.getAttribute('data-wa') || '').replace(/\D+/g, '');
    const msg = encodeURIComponent(el.getAttribute('data-text') || '');
    const link = raw ? `https://wa.me/${raw}${msg ? ('?text=' + msg) : ''}` : '#';
    el.setAttribute('href', link);
  })();
</script>
