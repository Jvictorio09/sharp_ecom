{% extends "dashboard/base_dashboard.html" %}
{% block content %}
<form id="ordersFilter"
      method="get"
      data-export-url="{% url 'order_export' %}"
      class="flex flex-wrap items-end gap-3 mb-4">

  <div>
    <label class="text-xs">Status</label>
    <select name="status" class="block mt-1 px-3 py-2 rounded-xl border border-[#E1E1E1] bg-white">
      <option value="all" {% if status == "all" %}selected{% endif %}>All</option>
      {% for s in order_statuses %}
        <option value="{{ s }}" {% if status == s %}selected{% endif %}>{{ s|title }}</option>
      {% endfor %}
    </select>
  </div>

  <div>
    <label class="text-xs">Sort</label>
    <select name="sort" class="block mt-1 px-3 py-2 rounded-xl border border-[#E1E1E1] bg-white">
      <option value="created_desc" {% if sort == "created_desc" %}selected{% endif %}>Newest first</option>
      <option value="created_asc"  {% if sort == "created_asc" %}selected{% endif %}>Oldest first</option>
      <option value="status_asc"   {% if sort == "status_asc" %}selected{% endif %}>Status ↑</option>
      <option value="status_desc"  {% if sort == "status_desc" %}selected{% endif %}>Status ↓</option>
      <option value="total_desc"   {% if sort == "total_desc" %}selected{% endif %}>Total high → low</option>
      <option value="total_asc"    {% if sort == "total_asc" %}selected{% endif %}>Total low → high</option>
    </select>
  </div>

  <div>
    <label class="text-xs">From</label>
    <input type="date" name="from" value="{{ date_from|date:'Y-m-d' }}"
           class="block mt-1 px-3 py-2 rounded-xl border border-[#E1E1E1] bg-white">
  </div>

  <div>
    <label class="text-xs">To</label>
    <input type="date" name="to" value="{{ date_to|date:'Y-m-d' }}"
           class="block mt-1 px-3 py-2 rounded-xl border border-[#E1E1E1] bg-white">
  </div>

  <!-- Product: dropdown (exact match) + optional free-text (name/SKU) -->
  <div class="min-w-[260px]">
    <label class="text-xs">Product</label>
    <select name="product_id"
            class="block w-full mt-1 px-3 py-2 rounded-xl border border-[#E1E1E1] bg-white">
      <option value="">All products</option>
      {% if products %}
        {% for p in products %}
          <option value="{{ p.id }}"
                  {% if product_id|default:''|stringformat:'s' == p.id|stringformat:'s' %}selected{% endif %}>
            {{ p.name }}
          </option>
        {% endfor %}
      {% endif %}
    </select>
    <div class="text-[11px] mt-1 opacity-70">
      or type: 
      <input name="product" value="{{ product|default_if_none:'' }}" placeholder="Name / SKU"
             class="inline-block w-[190px] px-3 py-1 rounded-lg border border-[#E1E1E1] bg-white" />
    </div>
  </div>

  <div class="flex-1 min-w-[200px]">
    <label class="text-xs">Search</label>
    <input name="q" value="{{ q|default_if_none:'' }}" placeholder="Order #, name, email, phone"
           class="block w-full mt-1 px-4 py-2 rounded-xl border border-[#E1E1E1] bg-white" />
  </div>

  <div class="flex items-center gap-2 mt-2">
    <button class="px-5 py-2 rounded-full text-white bg-[var(--sharp-mineral)] hover:bg-[var(--sharp-hunter)]">
      Apply
    </button>

    <!-- Export (real downloads; not AJAX) -->
    <a id="exportXlsx"
       class="px-4 py-2 rounded-full border border-[#E1E1E1] bg-white hover:border-[var(--sharp-mineral)]"
       href="#">Export Excel</a>
    <a id="exportPdf"
       class="px-4 py-2 rounded-full border border-[#E1E1E1] bg-white hover:border-[var(--sharp-mineral)]"
       href="#">Export PDF</a>
  </div>
</form>

<div id="ordersTable">
  {% include "dashboard/_orders_table.html" %}
</div>

<script>
(function () {
  const form = document.getElementById('ordersFilter');
  const container = document.getElementById('ordersTable');
  const xlsxBtn = document.getElementById('exportXlsx');
  const pdfBtn  = document.getElementById('exportPdf');
  const exportBase = form?.dataset?.exportUrl || '/dashboard/orders/export/';

  if (!form || !container) return;

  const debounce = (fn, ms=350) => { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; };
  const buildQuery = () => new URLSearchParams(new FormData(form));

  function setExportLinks() {
    if (!xlsxBtn || !pdfBtn) return;
    const params = buildQuery();
    params.set('export', 'excel');
    xlsxBtn.href = exportBase + '?' + params.toString();
    params.set('export', 'pdf');
    pdfBtn.href  = exportBase + '?' + params.toString();
  }

  function loadViaAjax() {
    const params = buildQuery();
    const url = window.location.pathname + '?' + params.toString();
    fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(html => {
        container.innerHTML = html;
        history.replaceState(null, '', url);
        setExportLinks(); // keep export links in sync after results update
      })
      .catch(() => { window.location.href = url; });
  }

  // AJAX triggers
  form.addEventListener('submit', (e) => { e.preventDefault(); loadViaAjax(); });
  form.querySelectorAll('select').forEach(sel => sel.addEventListener('change', loadViaAjax));
  ['q','product'].forEach(name => {
    const el = form.querySelector(`[name="${name}"]`);
    if (el) el.addEventListener('input', debounce(loadViaAjax, 400));
  });
  ['from','to'].forEach(name => {
    const el = form.querySelector(`[name="${name}"]`);
    if (el) el.addEventListener('change', loadViaAjax);
  });

  // Keep export links live as user edits
  form.addEventListener('input', setExportLinks);
  form.addEventListener('change', setExportLinks);
  setExportLinks();
})();
</script>
{% endblock %}
